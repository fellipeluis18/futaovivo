<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futao Vivo Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="nav-actions">
      <button id="back" class="icon-button" title="Voltar" aria-label="Voltar">‹</button>
      <button id="forward" class="icon-button" title="Avançar" aria-label="Avançar">›</button>
      <button id="reload" class="icon-button" title="Recarregar" aria-label="Recarregar">↻</button>
      <button id="favorite-pages" class="icon-button" title="Abrir favoritos" aria-label="Abrir favoritos">★</button>
    </div>
    <form id="address-form" class="address-wrap">
      <input id="address" autocomplete="off" spellcheck="false" aria-label="Barra de endereço" placeholder="Pesquisar ou inserir endereço">
      <button id="favorite" class="icon-button favorite-button" type="button" title="Adicionar aos favoritos" aria-label="Adicionar aos favoritos">☆</button>
    </form>
    <div class="tab-strip" id="tabs"></div>
    <div class="browser-tools">
      <button id="install-extension" class="icon-button install-extension" title="Instalar extensão" aria-label="Instalar extensão" hidden>Instalar</button>
      <button id="new-tab" class="new-tab" title="Nova guia" aria-label="Nova guia">+</button>
      <button id="tile" class="icon-button tile-button" title="Alternar mosaico" aria-label="Alternar mosaico">▦</button>
      <button id="select-all" class="icon-button" title="Selecionar todas as abas" aria-label="Selecionar todas as abas">☑</button>
      <button id="side-panel" class="icon-button" title="Painel lateral" aria-label="Painel lateral">▥</button>
      <button id="menu-button" class="icon-button" title="Menu" aria-label="Menu">⋮</button>
    </div>
    <div class="window-actions">
      <button id="minimize" aria-label="Minimizar">−</button>
      <button id="maximize" aria-label="Maximizar">□</button>
      <button id="close" aria-label="Fechar">×</button>
    </div>
  </header>
  <aside id="sidebar" class="sidebar" hidden>
    <div class="sidebar-heading"><strong>Painel lateral</strong><button id="close-sidebar">×</button></div>
    <p>Favoritos e abas selecionadas</p>
    <div id="favorites-list"></div>
    <div id="selected-list"></div>
  </aside>
  <script src="renderer.js"></script>
</body>
</html>
